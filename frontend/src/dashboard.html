<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - نظام إدارة بيع الكباش</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- القائمة الجانبية -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/images/logo/logo.png" alt="شعار النظام">
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="#"><i class="fas fa-home"></i> الرئيسية</a></li>
                    <li id="adminMenu" style="display: none;">
                        <a href="#"><i class="fas fa-users"></i> إدارة المراقبين</a>
                    </li>
                    <li id="adminStockMenu" style="display: none;">
                        <a href="#"><i class="fas fa-sheep"></i> إدارة المخزون</a>
                    </li>
                    <li><a href="#"><i class="fas fa-chart-bar"></i> التقارير</a></li>
                    <li><a href="#"><i class="fas fa-bell"></i> التنبيهات</a></li>
                    <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a></li>
                </ul>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            <header class="main-header">
                <div class="user-info">
                    <span id="currentTime"></span>
                    <span id="userName"></span>
                </div>
                <div class="notifications">
                    <button id="notificationBtn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">0</span>
                    </button>
                </div>
            </header>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>إجمالي نقاط البيع</h3>
                    <p id="totalSalesPoints">0</p>
                </div>
                <div class="stat-card">
                    <h3>إجمالي المخزون</h3>
                    <p id="totalStock">0</p>
                </div>
                <div class="stat-card">
                    <h3>التحديثات المطلوبة</h3>
                    <p id="pendingUpdates">0</p>
                </div>
            </div>

            <div class="data-section">
                <div class="section-header">
                    <h2>نقاط البيع النشطة</h2>
                    <div class="section-actions">
                        <button class="refresh-btn"><i class="fas fa-sync"></i> تحديث</button>
                    </div>
                </div>
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>نقطة البيع</th>
                                <th>المخزون الحالي</th>
                                <th>آخر تحديث</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="salesPointsTable">
                            <!-- سيتم ملء هذا الجزء عبر JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- نافذة التنبيهات -->
    <div id="notificationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>التنبيهات</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="notificationsList">
                    <!-- سيتم ملء هذا الجزء عبر JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/your-kit-code.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
